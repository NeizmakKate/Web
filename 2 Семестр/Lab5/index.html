<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Квадрат числа | AJAX</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f0e6;
            color: #3b2a1f;
        }
        .card {
            background: #fff8ef;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            border: 1px solid #e0c8a8;
        }
        h1 {
            text-align: center;
            color: #8b4513;
        }
        input {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            border: 2px solid #c29a6b;
            border-radius: 8px;
            margin: 15px 0;
            box-sizing: border-box;
            background: #fffdf9;
        }
        button {
            background: #8b4513;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        button:hover {
            background: #a0522d;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background: #f0e3d0;
            border-radius: 8px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #2c1a0c;
            border-left: 5px solid #8b4513;
        }
        .error {
            color: #b33;
            background: #ffe6e6;
            border-left-color: #b33;
        }
        .loading {
            opacity: 0.6;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Обчислення квадрата числа</h1>
        <p>Введіть число – сервер обчислить його квадрат через AJAX без перезавантаження сторінки</p>
        <input type="number" id="numberInput" placeholder="Наприклад: 7" step="any">
        <button id="calcBtn">Обчислити квадрат</button>
        <div id="resultBlock" class="result">Результат з'явиться тут</div>
    </div>

    <script>
        const inputEl = document.getElementById('numberInput');
        const btn = document.getElementById('calcBtn');
        const resultBlock = document.getElementById('resultBlock');

        async function sendRequest(number) {
            // Показуємо стан завантаження
            resultBlock.textContent = "⏳ Обчислюється...";
            resultBlock.classList.remove('error');
            btn.classList.add('loading');
            
            try {
                // AJAX-запит сервер
                const response = await fetch('/api/square', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ number: parseFloat(number) })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Помилка сервера: ${response.status} - ${errorText}`);
                }

                const data = await response.json();
                
                resultBlock.textContent = `✅ Квадрат числа ${data.number} = ${data.square}`;
                resultBlock.classList.remove('error');
            } catch (error) {
                console.error('AJAX помилка:', error);
                resultBlock.textContent = `❌ Помилка: ${error.message}`;
                resultBlock.classList.add('error');
            } finally {
                btn.classList.remove('loading');
            }
        }

        btn.addEventListener('click', () => {
            let rawValue = inputEl.value.trim();
            if (rawValue === "") {
                resultBlock.textContent = "❌ Будь ласка, введіть число";
                resultBlock.classList.add('error');
                return;
            }
            const num = parseFloat(rawValue);
            if (isNaN(num)) {
                resultBlock.textContent = "❌ Некоректне число. Введіть числове значення.";
                resultBlock.classList.add('error');
                return;
            }
            sendRequest(num);
        });

        
        inputEl.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                btn.click();
            }
        });
    </script>
</body>
</html>
